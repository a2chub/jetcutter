[project]
name = "jetcutter"
version = "1.5.0-rc.1"
description = "DaVinci Resolve / Final Cut Pro 自動編集エージェント - 無音区間・フィラー自動検知・削除ツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "atusi" }]
keywords = ["davinci-resolve", "final-cut-pro", "fcpxml", "video-editing", "automation", "jet-cut", "whisper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.1",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
]
gui = [
    "pyobjc-core>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[project.scripts]
jetcutter = "jetcutter.main:app"

[project.gui-scripts]
jetcutter-gui = "jetcutter.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetcutter"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (standard Typer pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["jetcutter"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pydub.*",
    "ffmpeg.*",
    "faster_whisper.*",
    "AppKit.*",
    "objc.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=jetcutter --cov-report=term-missing"

# ========== Briefcase Configuration ==========
[tool.briefcase]
project_name = "JetCutter"
bundle = "com.atusi.jetcutter"
version = "1.5.0"
url = "https://github.com/a2chub/jetcutter"
license.file = "LICENSE"
author = "atusi"
author_email = "atusi@example.com"

[tool.briefcase.app.jetcutter]
formal_name = "JetCutter"
description = "AI Video Editor - 無音・フィラー自動検知ツール"
icon = "resources/icon"
sources = ["src/jetcutter"]
resources = [
    "LICENSES",
    "THIRD_PARTY_LICENSES.md",
]

requires = [
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.1",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyobjc-core>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[tool.briefcase.app.jetcutter.macOS]
universal_build = true
requires = []

[tool.briefcase.app.jetcutter.macOS.info]
NSHighResolutionCapable = true
LSMinimumSystemVersion = "11.0"
